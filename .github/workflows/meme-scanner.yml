name: xrpl-meme-scanner
# PAPER ONLY: reads public APIs (xrpl.to + public XRPL nodes), simulates $10 meme buys, commits logs.
# No secrets, no wallet, no transactions. Fully separate from paper-trading.yml.
on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 min (UTC), offset from the grid trader. Exits every run; xrpl.to discovery every run if the XRPLTO_API_KEY secret is set, else every >=15 min (state timestamp). GitHub often delays scheduled runs.
  workflow_dispatch: {}
permissions:
  contents: write                  # only to commit meme_scanner/ logs back to this repo
concurrency:              # at most 1 running + 1 pending; a newer pending run replaces an older pending one, so no queue builds up
  group: meme-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Meme scan (stdlib only, public read-only APIs)
        env:
          XRPLTO_API_KEY: ${{ secrets.XRPLTO_API_KEY }}   # optional; if unset, discovery throttles to every >=15 min
        run: python meme_scanner/scanner.py
      - name: Commit meme_scanner logs only
        run: |
          git config user.name "meme-scanner-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meme_scanner/state meme_scanner/logs meme_scanner/SUMMARY.md
          git diff --cached --quiet && exit 0
          git commit -m "meme scan $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
