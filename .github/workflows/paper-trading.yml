name: xrpl-paper-trading
# PAPER ONLY: reads public prices, simulates trades, commits the logs. No secrets, no wallet, no orders.
# GitHub's cron fires irregularly (~every 30 min), so each run loops: 3 ticks 900 s apart (~30 min), committing after each.
# Each tick pulls first and reads state/market.json from disk, so candle catch-up starts after the last processed candle (no double counting).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write            # only so the job can commit state/ logs/ SUMMARY.md back to this repo
concurrency:                 # one run at a time; a new trigger waits (never cancels the running loop)
  group: paper-trading
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tick loop (3 x 900 s, stdlib only, public APIs only)
        env:
          TICKS: "3"
          GAP: "900"
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sync() {
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash -q && return 0
              git rebase --abort 2>/dev/null; sleep $((i * 5))
            done; return 1
          }
          for n in $(seq 1 $TICKS); do
            t0=$(date +%s)
            echo "::group::tick $n/$TICKS $(date -u +%FT%TZ)"
            sync || echo "pull failed; ticking on current checkout"
            python paper_runner.py || echo "tick $n failed"
            python leverage/lev_runner.py || echo "leverage tick $n failed (main lines unaffected)"   # PAPER-only leveraged line, separate state
            python leverage/ta_runner.py || echo "leverage_ta tick $n failed (other lines unaffected)"   # PAPER-only TA long/short line
            python leverage/committee_runner.py || echo "committee tick $n failed (other lines unaffected)"   # PAPER-only 4-voter committee, XRP+BTC
            python leverage/kraken_runner.py || echo "kraken 1k tick $n failed (other lines unaffected)"   # PAPER-only candidate live setup: $1k Kraken PXRPUH, committee quick 2x/3x
            python sizes_summary.py || echo "sizes table tick $n failed (other lines unaffected)"   # $100 vs $500 view of the XRPL lines (display only)
            git add state/ logs/ SUMMARY.md leverage/
            if ! git diff --cached --quiet; then
              git commit -q -m "paper tick $(date -u +%FT%TZ)"
              for i in 1 2 3 4 5; do sync && git push -q && break; sleep $((i * 5)); done
            fi
            echo "::endgroup::"
            [ "$n" -lt "$TICKS" ] && sleep $(( GAP - ($(date +%s) - t0) > 0 ? GAP - ($(date +%s) - t0) : 0 ))
          done
          exit 0
