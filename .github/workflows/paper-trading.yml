name: xrpl-paper-trading
# PAPER ONLY: reads public prices, simulates trades, commits the logs. No secrets, no wallet, no orders.
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (UTC). GitHub may delay scheduled runs.
  workflow_dispatch: {}
permissions:
  contents: write            # only so the job can commit state/ logs/ SUMMARY.md back to this repo
concurrency:
  group: paper-trading
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paper tick (stdlib only, public APIs only)
        run: python paper_runner.py
      - name: Commit updated logs
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ logs/ SUMMARY.md
          git diff --cached --quiet || git commit -m "paper tick $(date -u +%FT%TZ)"
          git pull --rebase --autostash || true
          git push
